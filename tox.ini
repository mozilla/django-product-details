[tox]
args_are_paths = false
skip_missing_interpreters = true
envlist =
    py3.12-flake8
    py{3.10,3.11,3.12}-django42
    py{3.10,3.11,3.12,3.13,3.14}-django52
    py{3.12,3.13,3.14}-django{60,61}

[testenv]
usedevelop = true
pip_pre = true
allowlist_externals = ./runtests.py
commands = ./runtests.py
deps =
    django42: Django>=4.2,<5.0
    django52: Django>=5.2,<6.0
    django60: Django>=6.0,<6.1
    django61: Django>=6.1,<6.2

    responses==0.15.0
    requests==2.26.0
basepython =
    py3.10: python3.10
    py3.11: python3.11
    py3.12: python3.12
    py3.13: python3.13
    py3.14: python3.14

[testenv:py3.12-flake8]
deps = flake8
commands = flake8 product_details tests

[flake8]
max-line-length=120
